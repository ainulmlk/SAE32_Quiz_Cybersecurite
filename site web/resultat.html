<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Cyber : Résultat</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav><a class="brand" href="index.html">Quiz Cyber</a><div class="links"><a href="index.html">Accueil</a><a href="quiz.html">Quiz</a></div></nav>
<main class="wide">
<p class="label">Ta note</p>
<div class="grade" aria-live="polite">
  <svg viewBox="0 0 300 160" preserveAspectRatio="none" aria-hidden="true"><path d="M150 10C60 8 8 45 14 82C20 125 90 152 160 148C238 144 292 108 286 68C280 28 210 6 128 16"/></svg>
  <span id="score-n">0</span><span class="total">/<span id="score-t">10</span></span>
</div>
<p class="remark" id="verdict"></p>
<div class="actions">
  <a class="btn" href="quiz.html">Recommencer</a>
  <button class="btn ghost" id="copy" type="button">Copier mon score</button>
</div>
<p class="notice" id="demo" hidden>Ce sont des données d'exemple. <a href="quiz.html">Fais le quiz</a> pour voir tes vrais résultats.</p>

<section class="review" aria-label="Correction détaillée">
  <h2>La correction</h2>
  <div class="grid" id="grid"></div>
  <div class="toolbar">
    <div class="filters" role="group" aria-label="Filtrer les questions">
      <button class="chip" data-filter="all" aria-pressed="true">Toutes</button>
      <button class="chip" data-filter="ko" aria-pressed="false">Mes erreurs</button>
    </div>
    <button class="link-btn" id="toggle-all" type="button">Tout révéler</button>
  </div>
  <div id="list"></div>
</section>
</main>
<footer>Quiz Cyber, projet SAÉ 3.02 (maquette)</footer>

<script src="data.js"></script>
<script>
const L = ['A','B','C','D'];
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const review = QuizStore.loadReview();
const isDemo = !review;
const QUESTIONS = isDemo ? DEMO_QUESTIONS : review.map(r => ({q:r.q, choices:r.choices, correct:r.correct, why:r.why}));
const answers = isDemo ? [0,1,2,2,1,0,1,1,0,2] : review.map(r => r.user);   // démo : 7 / 10
const total = QUESTIONS.length;
document.getElementById('demo').hidden = !isDemo;

const score = QUESTIONS.filter((q, i) => answers[i] === q.correct).length;
if (!isDemo) QuizStore.saveScore(score);

/* Note + remarque de la prof */
document.getElementById('score-t').textContent = total;
const n = document.getElementById('score-n');
if (calm) n.textContent = score;
else {
  const t0 = performance.now(), dur = 700;
  (function tick(t){
    const p = Math.min((t - t0) / dur, 1);
    n.textContent = Math.round(score * p);
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}
const r = score / total;
document.getElementById('verdict').textContent =
  r === 1 ? "Sans faute, bravo !" : r >= .8 ? "Très bien, il ne manque presque rien." : r >= .5 ? "Pas mal ! Relis tes erreurs plus bas." : "Courage, regarde la correction et retente.";

/* Liste des questions */
const list = document.getElementById('list');
const grid = document.getElementById('grid');
QUESTIONS.forEach((item, i) => {
  const user = answers[i], ok = user === item.correct;
  const el = document.createElement('article');
  el.className = 'q ' + (ok ? 'ok' : 'ko');
  el.id = 'q' + i;
  el.dataset.status = ok ? 'ok' : 'ko';
  el.innerHTML = `
    <button class="q-head" type="button" aria-expanded="false" aria-controls="b${i}">
      <span class="mark" aria-hidden="true">${ok ? '✓' : '✕'}</span>
      <span class="q-title"><span class="sr-only">${ok ? 'Réussie : ' : 'Ratée : '}</span>${i + 1}. ${esc(item.q)}</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>
    </button>
    <div class="q-body" id="b${i}"><div>
      <ul class="answers">
        ${item.choices.map((c, k) => {
          const good = k === item.correct, mine = k === user;
          const cls = good ? 'good' : mine ? 'bad' : '';
          const tag = good && mine ? 'ta réponse, juste' : good ? 'la bonne' : mine ? 'ton choix' : '';
          return `<li class="${cls}"><span>${L[k]}. ${esc(c)}</span><span class="tag">${tag}</span></li>`;
        }).join('')}
      </ul>
      <p class="explain">${esc(item.why)}</p>
    </div></div>`;
  list.appendChild(el);

  const cell = document.createElement('button');
  cell.type = 'button';
  cell.className = 'cell ' + (ok ? 'ok' : 'ko');
  cell.textContent = i + 1;
  cell.setAttribute('aria-label', `Question ${i + 1} : ${ok ? 'réussie' : 'ratée'}`);
  cell.addEventListener('click', () => {
    document.querySelector('.chip[data-filter="all"]').click();
    setOpen(el, true); syncToggle();
    el.scrollIntoView({behavior: calm ? 'auto' : 'smooth', block: 'center'});
  });
  grid.appendChild(cell);
});

function setOpen(el, open){
  el.classList.toggle('open', open);
  el.querySelector('.q-head').setAttribute('aria-expanded', open);
}
list.addEventListener('click', e => {
  const head = e.target.closest('.q-head');
  if (head) { const q = head.parentElement; setOpen(q, !q.classList.contains('open')); syncToggle(); }
});

/* Tout révéler / masquer */
const toggleAll = document.getElementById('toggle-all');
const visibleQs = () => [...list.children].filter(q => !q.hidden);
function syncToggle(){
  const v = visibleQs();
  toggleAll.textContent = v.length && v.every(q => q.classList.contains('open')) ? 'Tout masquer' : 'Tout révéler';
}
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === 'Tout révéler';
  visibleQs().forEach(q => setOpen(q, open));
  syncToggle();
});

/* Filtre : toutes / mes erreurs */
document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
  const f = chip.dataset.filter;
  [...list.children].forEach(q => q.hidden = f === 'ko' && q.dataset.status !== 'ko');
  syncToggle();
}));

/* Copier le score */
const copyBtn = document.getElementById('copy');
copyBtn.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(`J'ai eu ${score}/${total} au Quiz Cyber !`); copyBtn.textContent = 'Copié !'; }
  catch(e) { copyBtn.textContent = 'Copie impossible'; }
  setTimeout(() => copyBtn.textContent = 'Copier mon score', 1800);
});
</script>
</body></html>
