<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Cyber : Question</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav><a class="brand" href="index.html">Quiz Cyber</a><div class="links"><a href="index.html">Accueil</a><a href="quiz.html" aria-current="page">Quiz</a></div></nav>
<main>
<div class="qhead"><p class="label" id="counter">Question 1 sur 10</p><a class="quit" href="index.html">Quitter</a></div>
<div class="progress" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="bar"></div></div>
<h2 id="qtext" tabindex="-1"></h2>
<form id="form" autocomplete="off">
  <fieldset id="options" aria-labelledby="qtext"></fieldset>
  <div id="feedback" class="feedback" role="status" hidden></div>
  <div class="actions">
    <button class="btn" id="action" type="submit" disabled>Valider</button>
    <p class="hint">Astuce : les touches 1 à 4 marchent aussi.</p>
  </div>
</form>
</main>
<script src="data.js"></script>
<script>
let QUESTIONS = [], total = QUIZ_LENGTH;
const $ = id => document.getElementById(id);
const form = $('form'), opts = $('options'), fb = $('feedback'), btn = $('action');
let i = 0, answered = false;
const review = [];

function setBar(n){
  $('bar').style.width = (n / total * 100) + '%';
  $('bar').parentElement.setAttribute('aria-valuenow', n);
}

function render(){
  const item = QUESTIONS[i];
  answered = false;
  $('counter').textContent = `Question ${i + 1} sur ${total}` + (item.theme ? ` · ${item.theme}` : '');
  $('qtext').textContent = item.q;
  opts.innerHTML = item.choices.map((c, k) =>
    `<label class="opt"><input type="radio" name="reponse" value="${k}"><span class="key">${k + 1}</span><span class="txt">${esc(c.text)}</span></label>`
  ).join('');
  fb.hidden = true;
  btn.textContent = 'Valider';
  btn.disabled = true;
  setBar(i);
  $('qtext').focus({preventScroll:true});
}

function showError(msg){
  fb.className = 'feedback ko';
  fb.innerHTML = `<p>${msg}</p>`;
  fb.hidden = false;
}

async function check(sel){
  const item = QUESTIONS[i];
  btn.disabled = true;
  let res;
  try { res = await apiVerify(item.id, item.choices[sel].id); }
  catch(e) { showError('Vérification impossible. Réessaie dans un instant.'); btn.disabled = false; return; }

  const ok = res.ok;
  const goodIdx = ok ? sel : item.choices.findIndex(c => res.correct.includes(c.id));
  review[i] = {q: item.q, choices: item.choices.map(c => c.text), correct: goodIdx, user: sel, why: res.why || ''};
  answered = true;
  [...opts.children].forEach((label, k) => {
    label.classList.add('locked');
    label.querySelector('input').disabled = true;
    if (res.correct.includes(item.choices[k].id)) { label.classList.add('good'); label.insertAdjacentHTML('beforeend', '<span class="tag">la bonne</span>'); }
    else if (k === sel) { label.classList.add('bad'); label.insertAdjacentHTML('beforeend', '<span class="tag">ton choix</span>'); }
  });
  fb.className = 'feedback ' + (ok ? 'ok' : 'ko');
  fb.innerHTML = `<strong>${ok ? 'Bien joué !' : 'Pas tout à fait.'}</strong><p>${ok ? '' : 'La bonne réponse : ' + esc(item.choices[goodIdx].text) + '. '}${esc(res.why || '')}</p>`;
  fb.hidden = false;
  btn.textContent = i === total - 1 ? 'Voir ma note' : 'Question suivante';
  btn.disabled = false;
  setBar(i + 1);
  btn.focus();
}

function next(){
  if (i === total - 1) { QuizStore.saveReview(review); location.href = 'resultat.html'; }
  else { i++; render(); }
}

opts.addEventListener('change', () => { btn.disabled = false; });
form.addEventListener('submit', e => {
  e.preventDefault();
  if (answered) return next();
  const sel = form.reponse.value;
  if (sel !== '') check(+sel);
});

/* Raccourcis clavier 1 à 4 */
document.addEventListener('keydown', e => {
  if (answered || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = parseInt(e.key, 10) - 1;
  const radios = opts.querySelectorAll('input');
  if (k >= 0 && k < radios.length) { radios[k].checked = true; radios[k].focus(); btn.disabled = false; }
});

/* Chargement des questions depuis la base */
(async () => {
  try {
    QUESTIONS = await apiQuestions();
    if (!QUESTIONS.length) throw new Error('vide');
    total = QUESTIONS.length;
    render();
  } catch(e) {
    $('qtext').textContent = 'Impossible de charger les questions.';
    showError('Vérifie que le serveur web et la base de données sont démarrés.');
  }
})();
</script>
</body></html>
